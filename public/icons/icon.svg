<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pempek" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Pempek body -->
    <ellipse cx="0" cy="0" rx="110" ry="80" fill="url(#pempek)" transform="rotate(-15)"/>
    <!-- Cuko sauce splash -->
    <ellipse cx="-30" cy="-20" rx="40" ry="25" fill="#450a0a" opacity="0.7" transform="rotate(-15)"/>
    <!-- Highlight/shine -->
    <ellipse cx="20" cy="-30" rx="30" ry="12" fill="#fde68a" opacity="0.3" transform="rotate(-15)"/>
    <!-- Central letter P -->
    <text x="0" y="15" font-family="system-ui,-apple-system,sans-serif" font-size="140" font-weight="700" fill="#f8fafc" text-anchor="middle" dominant-baseline="middle">P</text>
  </g>
</svg>
